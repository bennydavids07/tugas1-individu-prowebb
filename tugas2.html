<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Mahasiswa</title>

    <!-- Menggunakan CSS eksternal -->
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <form action="#" method="post">

        <fieldset>

            <legend>Formulir Data Mahasiswa</legend>

            <!-- TEXT -->
            <label for="nama">Nama Lengkap</label>
            <input 
                type="text" 
                id="nama" 
                name="nama"
                placeholder="Masukkan nama lengkap"
                required
            >

            <!-- PASSWORD -->
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="Masukkan password"
                required
            >

            <!-- SELECT OPTION -->
            <label for="jurusan">Program Studi</label>
            <select id="jurusan" name="jurusan" required>
                <option value=""> -Pilih Program Studi- </option>
                <option value="Ilmu Komputer">Ilmu Komputer</option>
                <option value="Teknologi Informasi">Teknologi Informasi</option>
            </select>

            <!-- RADIO BUTTON -->
            <div class="checks">

                <p>Jenis Kelamin</p>

                <label>
                    <input 
                        type="radio"
                        name="jenis_kelamin"
                        value="laki-laki"
                        required
                    >
                    Laki-laki
                </label>

                <label>
                    <input 
                        type="radio"
                        name="jenis_kelamin"
                        value="perempuan"
                        required
                    >
                    Perempuan
                </label>

            </div>

            <!-- CHECKBOX -->
            <div class="checks">

                <p>Hobi</p>

                <label>
                    <input 
                        type="checkbox"
                        name="hobi"
                        value="memancing"
                        required    
                    >
                    Memancing
                </label>

                <label>
                    <input 
                        type="checkbox"
                        name="hobi"
                        value="bermain game"
                        required
                    >
                    Bermain Game
                </label>

                <label>
                    <input 
                        type="checkbox"
                        name="hobi"
                        value="bernyanyi"
                        required
                    >
                    Bernyanyi
                </label>

            </div>

            <!-- TEXTAREA -->
            <label for="alamat">Alamat</label>

            <textarea
                id="alamat"
                name="alamat"
                placeholder="Masukkan alamat lengkap"
            ></textarea>

            <!-- SUBMIT -->
            <input 
                type="submit"
                value="Kirim"
            >

        </fieldset>

    </form>

</body>
</html>
