<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

<form action="#" method="post">
    <fieldset>

        <legend>Formulir Data Mahasiswa</legend>

        <label for="username">Username</label>
        <input 
            type="text" 
            id="username" 
            name="username"
            placeholder="Masukkan username"
            required
        >

        <label for="password">Password</label>
        <input 
            type="password" 
            id="password" 
            name="password"
            placeholder="Masukkan password"
            required
        >

        <label for="confirm_password">Confirm Password</label>
        <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password"
            placeholder="Masukkan ulang password"
            required
        >

        <label for="jurusan">Program Studi</label>
        <select id="jurusan" name="jurusan" required>
            <option value="">-Pilih Program Studi-</option>
            <option value="Ilmu Komputer">Ilmu Komputer</option>
            <option value="Teknologi Informasi">Teknologi Informasi</option>
        </select>

        <div class="checks">
            <p>Jenis Kelamin</p>

            <label>
                <input 
                    type="radio" 
                    name="jenis_kemamin" 
                    value="laki-laki"
                    required
                >
                Laki-laki
            </label>

            <label>
                <input 
                    type="radio" 
                    name="jenis_kelamin" 
                    value="perempuan"
                    required
                >
                Perempuan
            </label>
        </div>

        <div class="checks">
            <p>Hobi</p>

            <label>
                <input 
                    type="checkbox" 
                    name="hobi" 
                    value="membaca"
                    required
                >
                Membaca
            </label>

            <label>
                <input 
                    type="checkbox" 
                    name="hobi" 
                    value="memasak"
                    required
                >
                Memasak
            </label>

            <label>
                <input 
                    type="checkbox" 
                    name="hobi" 
                    value="bersepeda"
                    required
                >
                Bersepeda
            </label>
        </div>

        <label for="about">About Me</label>
        <textarea 
            id="about" 
            name="about"
            placeholder="Ceritakan sedikit tentang diri kamu..."
        ></textarea>

        <input type="submit" value="Submit">

    </fieldset>
</form>

</body>
</html>
